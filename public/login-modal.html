<div
        id="loginModal"
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="loginTitle">

        <div class="modalbox lg-card" id="loginCard" data-mode="login">

            <button
                class="x"
                id="closeLogin"
                type="button"
                aria-label="Close login">
                ×
            </button>


            <!-- STEP 1 -->

            <div id="loginStep1">

                <h2 id="loginTitle" class="lg-title">
                    <span id="lgTitleText">Welcome back</span>
                </h2>

                <p class="lg-sub" id="lgSubText">
                    Sign in to your account — we'll email you a 6-digit code, no password needed.
                </p>

                <!-- Login / Sign up switch -->
                <div class="lg-tabs" role="tablist" aria-label="Login or sign up">
                    <span class="lg-tab-pill" aria-hidden="true"></span>
                    <button type="button" class="lg-tab" data-mode="login" role="tab" aria-selected="true">Log in</button>
                    <button type="button" class="lg-tab" data-mode="signup" role="tab" aria-selected="false">Sign up</button>
                </div>

                <!-- Name (Sign up only) -->
                <div class="lg-collapse" id="lgNameWrap">
                    <div class="lg-collapse-in">
                        <div class="lg-field">
                            <label for="name">Name</label>
                            <input
                                id="name"
                                autocomplete="name"
                                maxlength="100"
                                placeholder="Your full name">
                        </div>
                    </div>
                </div>

                <div class="lg-field lg-field-go">
                    <div class="lg-in">
                        <label for="email">Email</label>
                        <input
                            id="email"
                            type="email"
                            autocomplete="email"
                            maxlength="254"
                            placeholder="username@gmail.com">
                    </div>

                    <button
                        id="sendOtpBtn"
                        class="lg-go"
                        type="button"
                        aria-label="Send login code">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                    </button>
                </div>

                <div class="lg-or"><span>OR</span></div>

                <button
                    id="googleLoginBtn"
                    class="lg-alt"
                    type="button">
                    <span class="lg-alt-ico" aria-hidden="true">
                        <svg viewBox="0 0 48 48" class="lg-g"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                    </span>
                    <span class="lg-alt-text">Continue with Google</span>
                    <span class="lg-alt-go" aria-hidden="true">
                        <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                    </span>
                </button>

                <p class="lg-foot">
                    <span class="lg-foot-login">New here? <button type="button" class="lg-inline" data-mode="signup">Sign up</button></span>
                    <span class="lg-foot-signup">Already have an account? <button type="button" class="lg-inline" data-mode="login">Log in</button></span>
                </p>

                <p class="lg-legal">
                    By continuing you agree to our
                    <a href="/terms.html">Terms</a> &amp;
                    <a href="/privacy.html">Privacy Policy</a>.
                </p>

            </div>

            <!-- ADMIN STEP (shown only when the admin email is entered) -->

            <div
                id="loginStepAdmin"
                class="hide">

                <h2 class="lg-title">
                    Admin login
                </h2>

                <p class="lg-sub">
                    Enter the admin password.
                </p>

                <div class="lg-field">
                    <label for="adminPass">Admin password</label>
                    <input
                        id="adminPass"
                        type="password"
                        autocomplete="current-password"
                        maxlength="200"
                        placeholder="Password">
                </div>

                <button
                    id="adminLoginBtn"
                    class="lg-primary"
                    type="button">

                    Login as Admin

                </button>

                <button
                    id="adminCustomerBtn"
                    class="lg-link"
                    type="button">

                    Login as customer instead

                </button>

            </div>


            <!-- STEP 2 -->

            <div
                id="loginStep2"
                class="hide">

                <h2 class="lg-title">
                    Enter code
                </h2>

                <p
                    class="lg-sub"
                    id="otpHint">

                    Check your email for the
                    6-digit code.

                </p>

                <div class="lg-field">
                    <label for="otp">Verification code</label>
                    <input
                        id="otp"
                        type="text"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        maxlength="6"
                        pattern="[0-9]{6}"
                        placeholder="6-digit code">
                </div>

                <button
                    id="verifyOtpBtn"
                    class="lg-primary"
                    type="button">

                    Verify &amp; Login

                </button>

                <button
                    id="resendOtpBtn"
                    class="lg-link"
                    type="button">

                    Resend code

                </button>

            </div>

        </div>

    </div>
