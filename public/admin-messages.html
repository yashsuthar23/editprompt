<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Contact Messages | EditPrompt Admin</title>
<link rel="stylesheet" href="/styles.css">
<style>
  .wrap{max-width:1000px;margin:0 auto;padding:40px 20px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
  .msg{border:1px solid #333;border-radius:14px;padding:16px;margin-bottom:12px;background:rgba(255,255,255,.03)}
  .msg .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:#aaa;margin-bottom:8px}
  .msg .topic{background:#e52329;color:#fff;border-radius:999px;padding:2px 10px;font-weight:700}
  .msg .body{white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.6}
  .msg a{color:var(--ivory,#e9d8bb)}
  #state{color:#aaa}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h2 style="margin:0">Contact Messages <small id="count" style="color:#aaa;font-size:14px"></small></h2>
    <div>
      <button class="btn ghost small" id="refresh" type="button">Refresh</button>
      <a class="btn ghost small" href="/admin">Back to Admin</a>
    </div>
  </div>
  <p id="state">Loading…</p>
  <div id="list"></div>
</div>
<script>
(function () {
  var state = document.getElementById("state"), list = document.getElementById("list"), count = document.getElementById("count");
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function load() {
    state.textContent = "Loading…"; list.innerHTML = "";
    fetch("/api/admin/contact-messages", { credentials: "same-origin", headers: { Accept: "application/json" } })
      .then(function (r) {
        if (r.status === 401) { state.innerHTML = 'Admin login required. <a href="/admin" style="color:#e9d8bb">Login at /admin</a>, then come back and refresh.'; return null; }
        if (!r.ok) throw new Error("Server error " + r.status);
        return r.json();
      })
      .then(function (d) {
        if (!d) return;
        var rows = d.messages || [];
        count.textContent = "(" + rows.length + ")";
        state.textContent = rows.length ? "" : "No messages yet.";
        list.innerHTML = rows.map(function (m) {
          return '<div class="msg"><div class="meta"><span class="topic">' + esc(m.topic) + '</span><b>' + esc(m.name) + '</b>' +
            '<a href="mailto:' + esc(m.email) + '">' + esc(m.email) + '</a><span>' + esc(m.created_at) + ' UTC</span></div>' +
            '<div class="body">' + esc(m.message) + '</div></div>';
        }).join("");
      })
      .catch(function (e) { state.textContent = "Could not load: " + e.message; });
  }
  document.getElementById("refresh").addEventListener("click", load);
  load();
})();
</script>
</body>
</html>
